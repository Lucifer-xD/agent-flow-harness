name: afh_app
description: "AFH for your phone"
publish_to: none
version: 2.0.3+20013

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  crypto: ^3.0.6
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.3
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  lucide_icons_flutter: ^4.0.1
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  image_picker: ^1.2.4
  file_picker: ^13.3.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  add_2_calendar: ^3.1.1
  flutter_contacts: ^2.6.0
  battery_plus: ^7.1.2
  speech_to_text: ^7.5.0
  html: ^0.15.7
  math_expressions: ^3.2.0
  flutter_tts: ^4.2.5
  quick_actions: ^1.1.1
  local_auth: ^3.0.2
  share_plus: ^13.3.1
  webview_flutter: ^4.14.1
  webview_flutter_android: any
  flutter_svg: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: any

flutter:
  uses-material-design: true
  assets:
    - assets/providers.json
    - assets/logos.json
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-400.ttf
        - asset: assets/fonts/Geist-500.ttf
          weight: 500
        - asset: assets/fonts/Geist-600.ttf
          weight: 600
        - asset: assets/fonts/Geist-700.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-400.ttf
        - asset: assets/fonts/GeistMono-500.ttf
          weight: 500
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
        - asset: assets/fonts/IBMPlexSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700
