appId: com.agentflowharness.app
---
- launchApp
- waitForAnimationToEnd
- takeScreenshot: 1-welcome
- tapOn: "Continue"
- waitForAnimationToEnd
- tapOn: "Continue"
- waitForAnimationToEnd
- tapOn: "Look around first"
- waitForAnimationToEnd
- takeScreenshot: 2-home
- tapOn:
    text: "Ask, or start some work"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 3-compose
- tapOn: "Add photos and files"
- waitForAnimationToEnd
- takeScreenshot: 4-add
- tapOn: "Photos"
- waitForAnimationToEnd
- takeScreenshot: 5-picker
- tapOn:
    point: "16%,45%"
- takeScreenshot: 5b-picked
- tapOn:
    point: "90%,17%"
- waitForAnimationToEnd
- takeScreenshot: 6-added
- extendedWaitUntil:
    visible: "Remove"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 7-ready
- inputText: "What is this"
- waitForAnimationToEnd
- takeScreenshot: 8-typed
