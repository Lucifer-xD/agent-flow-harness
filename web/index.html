<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Flow Harness</title>
  <link rel="icon" href="brand/favicon.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-mark" id="boot-mark"></div>
    <div class="boot-title">Agent Flow Harness</div>
    <div class="boot-status" id="boot-status">Starting the engine…</div>
  </div>

  <div class="titlebar" id="titlebar"><span id="tb-brand"></span><span class="tb-name">Agent Flow Harness</span><span class="tb-thread" id="tb-thread"></span></div>

  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <div class="brand" id="brand"><span>AFH</span></div>
        <button class="icon-btn" id="btn-collapse" title="Hide sidebar (Ctrl+B)"></button>
      </div>
      <button class="new-thread" id="btn-new" title="New thread (Ctrl+N)"><span class="ico" data-icon="plus"></span>New thread<kbd>Ctrl N</kbd></button>
      <button class="project-picker" id="project-picker"></button>
      <div class="sb-search"><span class="ico" data-icon="search"></span><input id="thread-search" placeholder="Search threads" /></div>
      <nav class="threads" id="threads"></nav>
      <div class="sb-foot">
        <button class="sb-foot-btn" id="btn-settings"><span class="ico" data-icon="settings"></span>Settings</button>
        <button class="icon-btn sb-mini" id="btn-lang" title="العربية / English"><span class="lang-mark">ع</span></button>
        <button class="icon-btn sb-mini" id="btn-theme" title="Switch dark / light"></button>
        <span class="conn" id="conn" title="Engine connection"></span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="btn-expand" title="Show sidebar (Ctrl+B)" hidden></button>
        <span class="tb-logo" id="tb-logo" hidden></span>
        <div class="tb-title" id="tb-title"></div>
        <button class="sub-chip" id="btn-subagents" type="button" hidden></button>
        <div class="tb-actions">
          <button class="chip-btn" id="btn-worktree" title="This thread works in its own git worktree" hidden></button>
          <button class="chip-btn" id="btn-goal" title="Set a goal: the agent keeps working until it is achieved"><span class="ico" data-icon="target"></span>Goal</button>
          <button class="chip-btn" id="btn-live" title="Watch files being written or edited"><span class="ico" data-icon="eye"></span>Live</button>
          <button class="chip-btn" id="btn-context" title="See and edit everything the model sees"><span class="ico" data-icon="list"></span>Context</button>
          <button class="chip-btn" id="btn-harness" title="See what the model is told"><span class="ico" data-icon="scroll"></span>Prompt</button>
          <button class="chip-btn" id="btn-changes" title="Changed files"><span class="ico" data-icon="diff"></span>Changes<span class="badge" id="changes-count" hidden></span></button>
          <button class="icon-btn" id="btn-thread-menu" title="Thread actions"></button>
        </div>
      </header>

      <section class="thread" id="thread">
        <div class="thread-inner" id="messages"></div>
      </section>
      <nav class="msg-rail" id="msg-rail" aria-label="Your messages"></nav>
      <div class="chat-resize" id="chat-resize" title="Drag to make the chat wider or narrower · double-click to reset"><i></i></div>

      <div class="composer-wrap">
        <div class="jump" id="jump" hidden><span class="ico" data-icon="arrow-down"></span></div>
        <div class="work-dock" id="work-dock"></div>
        <div class="slash-menu" id="slash-menu" hidden></div>
        <form class="composer" id="composer">
          <div class="attachments" id="attachments"></div>
          <textarea id="input" rows="1" placeholder="Ask anything…" spellcheck="true"></textarea>
          <div class="composer-bar">
            <div class="cb-left">
              <button type="button" class="icon-btn" id="btn-attach" title="Attach files"></button>
              <button type="button" class="icon-btn" id="btn-mic" title="Speak — your words are typed here"></button>
              <button type="button" class="pill" id="pick-agent"></button>
              <button type="button" class="pill" id="pick-mode"></button>
              <button type="button" class="pill draft-pill" id="draft-goal" title="Set a goal for the new thread" hidden></button>
              <button type="button" class="pill draft-pill" id="draft-worktree" title="Work in a separate git worktree (own branch and folder)" hidden></button>
            </div>
            <div class="cb-right">
              <button type="button" class="pill jobs-pill" id="jobs-pill" hidden></button>
              <span class="tps" id="tps"></span>
              <span class="ctx" id="ctx-meter" title="Context used"></span>
              <button type="button" class="pill" id="pick-model"></button>
              <button type="submit" class="send" id="btn-send" title="Send (Enter)"></button>
            </div>
          </div>
        </form>
        <div class="composer-hint" id="composer-hint"></div>
      </div>
    </main>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-head">
        <div class="drawer-title" id="drawer-title"></div>
        <button class="icon-btn" id="btn-drawer-close" title="Close"></button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>
  </div>

  <div id="overlay-root"></div>
  <div id="toasts" class="toasts"></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
