# Builds the iPhone app (app/, Flutter) on a Mac and uploads an unsigned AFH-Remote-<version>.ipa.
# Install it with AltStore or Sideloadly, which sign it with your own Apple ID; a TestFlight or App
# Store build needs an Apple Developer account and signing secrets instead of --no-codesign.
name: iOS app

on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Build
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          flutter pub get
          flutter build ios --release --no-codesign
          test -d build/ios/iphoneos/Runner.app

      - name: Package the .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "AFH-Remote-$VERSION.ipa" Payload)
          ls -la "$RUNNER_TEMP/ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: AFH-Remote-ios
          path: ${{ runner.temp }}/ipa/AFH-Remote-*.ipa
          if-no-files-found: error
