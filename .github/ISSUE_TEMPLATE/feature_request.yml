name: Feature request
description: An idea to make AFH better
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the goal, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: How you imagine it working.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: Workarounds you've tried, or other tools that do this well.
