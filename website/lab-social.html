<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>social card (local only — lab*.html is never deployed)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
    body { position: relative; background:
      radial-gradient(55% 60% at 82% 14%, rgba(255, 177, 31, 0.3) 0%, rgba(255, 177, 31, 0) 70%),
      radial-gradient(45% 50% at 10% 92%, rgba(255, 61, 138, 0.18) 0%, rgba(255, 61, 138, 0) 70%), #f7f3ee; }
    .card { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 440px; align-items: center; padding: 0 72px; }
    .brand { display: flex; align-items: center; gap: 14px; font: 600 22px var(--display); color: var(--ink-2); margin-bottom: 34px; }
    .brand img { width: 46px; height: auto; }
    h1 { margin: 0; font: 800 86px/0.98 var(--display); letter-spacing: -0.045em; color: var(--ink); }
    h1 span { display: block; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 0.08em; }
    p { margin: 26px 0 0; max-width: 640px; font: 500 22px/1.4 var(--body); color: var(--ink-2); }
    .pill { position: absolute; left: 72px; bottom: 44px; display: inline-flex; gap: 10px; align-items: center; padding: 10px 18px; border-radius: 999px; background: #fff; border: 1px solid var(--line); box-shadow: var(--sh-1); font: 600 17px var(--body); color: var(--ink-2); }
    .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
    .mark { position: relative; height: 100%; display: grid; place-items: center; }
    .mark img { width: 420px; height: auto; filter: drop-shadow(0 40px 60px rgba(255, 90, 90, 0.35)); }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <div class="brand"><img src="/assets/mark.svg" alt="">Agent Flow Harness</div>
      <h1>Build with any model.<span>On your PC.</span></h1>
      <p>A free desktop coding agent that plans, delegates and writes code with the models you choose.</p>
      <div class="pill"><i></i>Free · Windows · no account needed</div>
    </div>
    <div class="mark"><img src="/assets/mark.svg" alt=""></div>
  </div>
</body>
</html>
