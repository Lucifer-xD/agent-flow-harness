<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D lab · Agent Flow Harness</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0a0807; color: #f6efe9; font: 500 13px Inter, system-ui, sans-serif; overflow: hidden; }
    #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    .bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 8px; max-width: calc(100vw - 32px); border: 1px solid rgba(255, 236, 222, 0.12); border-radius: 16px; background: rgba(18, 14, 12, 0.88); }
    .bar button { padding: 8px 13px; border: 1px solid transparent; border-radius: 10px; background: none; color: #c2b6ac; font: inherit; cursor: pointer; }
    .bar button:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .bar button.on { color: #fff; border-color: rgba(255, 106, 42, 0.6); background: rgba(255, 106, 42, 0.14); }
    .bar .sep { width: 1px; margin: 4px 2px; background: rgba(255, 236, 222, 0.12); }
    .hud { position: fixed; top: 16px; left: 16px; padding: 10px 14px; border-radius: 12px; background: rgba(18, 14, 12, 0.8); font: 500 12px/1.6 "JetBrains Mono", monospace; color: #c2b6ac; white-space: pre; }
    .hud b { color: #3ddc84; font-weight: 500; }
    .note { position: fixed; top: 16px; right: 16px; max-width: 300px; padding: 10px 14px; border-radius: 12px; background: rgba(18, 14, 12, 0.8); color: #85796f; font-size: 12px; line-height: 1.5; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hud" data-hud>starting…</div>
  <div class="note">The mark, alive, on its own. Pick a stage to watch the same six cables and dots move into it; click empty space for a pulse; hover a dot. Local preview only — not part of the site.</div>
  <nav class="bar">
    <button data-shape="mark" class="on">Logo</button>
    <button data-shape="core">Flow</button>
    <button data-shape="plan">Plan</button>
    <button data-shape="net">Agents</button>
    <button data-shape="code">Code</button>
    <button data-shape="ring">Models</button>
    <button data-shape="spread">Lost</button>
    <span class="sep"></span>
    <button data-tour>Play the story</button>
    <button data-act>Busy: off</button>
  </nav>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module">
    import { createScene } from "/js/scene.js";
    const { gsap } = window;
    const scene = createScene(document.querySelector("#scene"), { mobile: matchMedia("(max-width: 760px)").matches });
    window.afhScene = scene;
    const { state } = scene;
    const SHAPES = ["mark", "core", "net", "plan", "code", "ring", "spread"];
    const LOOKS = {
      mark: { zoom: 0, spin: 0, tilt: 0, shiftX: 0, shiftY: 0 }, core: { zoom: -0.8, spin: 0.3, tilt: 0.6, shiftX: 0, shiftY: -0.2 }, plan: { zoom: -1.2, spin: 0.25, tilt: 0.2, shiftX: -0.2, shiftY: -0.4 },
      net: { zoom: -0.6, spin: 0.35, tilt: 0.18, shiftX: 0, shiftY: -0.3 }, code: { zoom: -1.4, spin: 0.2, tilt: 0.15, shiftX: -0.6, shiftY: -0.5 }, ring: { zoom: -1.2, spin: 0.4, tilt: 0.55, shiftX: 0, shiftY: -0.3 }, spread: { zoom: -0.5, spin: 0, tilt: 0, shiftX: 0, shiftY: 0 },
    };
    let busy = false;
    const go = (name, duration = 2.2) => {
      document.querySelectorAll("[data-shape]").forEach((b) => b.classList.toggle("on", b.dataset.shape === name));
      const to = Object.fromEntries(SHAPES.map((k) => [k, k === name ? 1 : 0]));
      gsap.to(state, { ...to, ...LOOKS[name], activity: busy ? 1.4 : 0.6, duration, ease: "power3.inOut", overwrite: "auto" });
    };
    document.querySelectorAll("[data-shape]").forEach((b) => b.addEventListener("click", () => go(b.dataset.shape)));
    let tour = null;
    document.querySelector("[data-tour]").addEventListener("click", (e) => {
      if (tour) { tour.kill(); tour = null; e.target.textContent = "Play the story"; return; }
      e.target.textContent = "Stop";
      tour = gsap.timeline({ repeat: -1 });
      ["mark", "core", "plan", "net", "code", "ring"].forEach((s, i) => tour.call(() => go(s), null, i * 5));
      tour.to({}, { duration: 5 });
    });
    document.querySelector("[data-act]").addEventListener("click", (e) => {
      busy = !busy;
      e.target.textContent = `Busy: ${busy ? "on" : "off"}`;
      gsap.to(state, { activity: busy ? 1.4 : 0.6, duration: 0.8 });
    });
    addEventListener("pointerdown", (e) => { if (!e.target.closest("button, .hud, .note")) scene.burst(1); });
    // frame meter
    const hud = document.querySelector("[data-hud]");
    let frames = 0, last = performance.now(), worst = 0, prev = last;
    const tick = (now) => {
      frames++; worst = Math.max(worst, now - prev); prev = now;
      if (now - last > 1000) {
        const q = scene.three?.quality?.() || [];
        hud.innerHTML = `<b>${Math.round((frames * 1000) / (now - last))} fps</b>  worst ${worst.toFixed(1)} ms\nquality  ${q.join(" · ")}`;
        frames = 0; last = now; worst = 0;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    state.activity = 0.6;
  </script>
</body>
</html>
