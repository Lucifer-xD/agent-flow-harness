<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>AFH Chat</title>
  <meta name="description" content="Chat with any model from your browser: 228 providers, sign in with ChatGPT, Copilot or OpenRouter, with web search and more.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0d0d" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <script>
    // the theme before anything paints: no flash of the wrong colours
    try {
      const t = JSON.parse(localStorage.getItem("afh.web.v1") || "{}").theme;
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <div id="app" class="app">
    <div class="boot"><img src="/assets/mark.svg" alt="" width="64"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module" src="/js/chat/main.js"></script>
</body>
</html>
