<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src http://127.0.0.1:* data:;" />
<style>
  /* The light is the AFH mark's own: amber, orange, coral, magenta. Everything that moves is a transform or an
     opacity on an already painted layer, so the glow costs almost nothing while it breathes. */
  @property --r { syntax: "<length>"; inherits: true; initial-value: 0px; }
  :root {
    --a: 255, 177, 60; --b: 255, 122, 61; --c: 255, 78, 98; --d: 232, 44, 150; --hot: 255, 226, 196;
    --solid: #ff7a3d; --ink: #f7f4f1; --ink-2: #cdc6c0; --ink-3: #958d86; --glass: rgba(20, 17, 16, .92); --line: rgba(255, 255, 255, .09);
    --out: cubic-bezier(.16, 1, .3, 1); --ease: cubic-bezier(.4, 0, .2, 1); --spring: cubic-bezier(.3, 1.45, .5, 1);
  }
  body.teaching { --a: 120, 210, 255; --b: 77, 163, 255; --c: 92, 124, 255; --d: 130, 96, 255; --hot: 214, 234, 255; --solid: #4da3ff; }
  body.stopped { --a: 255, 120, 96; --b: 255, 84, 74; --c: 255, 60, 70; --d: 220, 36, 70; --hot: 255, 206, 200; --solid: #ff5a4f; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; cursor: default; color: var(--ink);
    font: 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  /* ---- the glow round the screen ---------------------------------------------------------------- */
  #glow { position: fixed; inset: 0; overflow: hidden; pointer-events: none; opacity: 0; transform: scale(1.035); transition: opacity .55s var(--ease), transform .9s var(--out); }
  body.on #glow { opacity: .74; transform: none; }
  body.on.busy #glow { opacity: 1; }
  #glow > * { position: absolute; }
  /* the soft body: three depths of light falling into the screen, breathing between two strengths */
  #glow .haze { inset: 0; box-shadow: inset 0 0 26px rgba(var(--b), .5), inset 0 0 74px rgba(var(--b), .3), inset 0 0 170px rgba(var(--c), .17); }
  #glow .breath { inset: 0; box-shadow: inset 0 0 40px rgba(var(--a), .5), inset 0 0 120px rgba(var(--b), .34), inset 0 0 250px rgba(var(--d), .16); opacity: .2; }
  body.on #glow .breath { animation: breath 3.4s ease-in-out infinite; }
  @keyframes breath { 0%, 100% { opacity: .12; } 50% { opacity: .95; } }
  /* the hot rim: the brightest light is a hair wide, right at the edge */
  #glow .rim { inset: 0; box-shadow: inset 0 0 0 1.5px rgba(var(--hot), .62), inset 0 0 5px 1px rgba(var(--a), .78), inset 0 0 13px 1px rgba(var(--b), .62); }
  /* four lights that run round the edge, one per side, each handing over to the next at the corner */
  #glow .runs { inset: 0; opacity: 0; transition: opacity .9s var(--ease); }
  body.on.busy #glow .runs { opacity: 1; }
  #glow .run { position: absolute; opacity: 0; will-change: transform, opacity; animation: 7.2s linear infinite paused; }
  body.on.busy #glow .run { animation-play-state: running; }
  #glow .run.t, #glow .run.u { left: 0; width: 64vw; height: 200px; background: radial-gradient(closest-side, rgba(var(--a), .8), rgba(var(--b), .46) 30%, rgba(var(--c), .2) 60%, transparent); }
  #glow .run.t { top: -100px; animation-name: run-t; }
  #glow .run.u { bottom: -100px; animation-name: run-u; }
  #glow .run.r, #glow .run.l { top: 0; width: 200px; height: 84vh; background: radial-gradient(closest-side, rgba(var(--b), .78), rgba(var(--c), .46) 32%, rgba(var(--d), .18) 64%, transparent); }
  #glow .run.r { right: -100px; animation-name: run-r; }
  #glow .run.l { left: -100px; animation-name: run-l; }
  @keyframes run-t { 0% { transform: translateX(-52vw); opacity: 0; } 7%, 30% { opacity: 1; } 37%, 100% { transform: translateX(88vw); opacity: 0; } }
  @keyframes run-r { 0%, 25% { transform: translateY(-70vh); opacity: 0; } 32%, 48% { opacity: 1; } 55%, 100% { transform: translateY(86vh); opacity: 0; } }
  @keyframes run-u { 0%, 46% { transform: translateX(88vw); opacity: 0; } 53%, 76% { opacity: 1; } 83%, 100% { transform: translateX(-52vw); opacity: 0; } }
  @keyframes run-l { 0%, 74% { transform: translateY(86vh); opacity: 0; } 81%, 95% { opacity: 1; } 100% { transform: translateY(-70vh); opacity: 0; } }
  /* a pulse of light for a moment that matters: a screenshot, starting, stopping */
  #glow .flare { inset: 0; opacity: 0; box-shadow: inset 0 0 34px rgba(var(--hot), .75), inset 0 0 110px rgba(var(--a), .5), inset 0 0 240px rgba(var(--b), .26); }

  /* ---- the pill ---------------------------------------------------------------------------------- */
  #pill { position: fixed; z-index: 70; top: 18px; left: 50%; display: flex; align-items: center; gap: 13px; height: 48px; padding: 0 7px 0 15px; border-radius: 24px;
    background: var(--glass); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 rgba(255,255,255,.07), 0 12px 34px rgba(0,0,0,.42), 0 0 40px rgba(var(--b), .4);
    transform: translate(-50%, -30px) scale(.9); opacity: 0; transition: opacity .35s var(--ease), transform .6s var(--spring); }
  body.on.home #pill { opacity: 1; transform: translate(-50%, 0); }
  #pill .mark { position: relative; width: 27px; height: 17px; flex: none; }
  #pill .mark svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #pill .mark::before { content: ""; position: absolute; inset: -11px; border-radius: 50%; background: radial-gradient(closest-side, rgba(var(--b), .7), transparent); opacity: .3; }
  body.on.busy #pill .mark::before { animation: breath 1.7s ease-in-out infinite; }
  #pill .words { display: flex; flex-direction: column; min-width: 196px; max-width: 44vw; }
  #pill .who { font-weight: 600; font-size: 13px; white-space: nowrap; }
  #pill .status { position: relative; height: 16px; font-size: 11.5px; color: var(--ink-2); overflow: hidden; }
  #pill .status span { position: absolute; inset: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: transform .4s var(--out), opacity .3s; }
  #pill .status span.out { transform: translateY(-100%); opacity: 0; }
  #pill .status span.in { transform: translateY(100%); opacity: 0; }
  #pill .wait { width: 18px; height: 18px; display: none; }
  #pill .wait svg { transform: rotate(-90deg); display: block; }
  #pill .wait circle { fill: none; stroke: rgb(var(--a)); stroke-width: 2.4; stroke-linecap: round; }
  body.waiting #pill .wait { display: block; }
  #stop { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 13px; border-radius: 17px; font-weight: 600; font-size: 12.5px;
    background: #f7f4f1; color: #1a1513; transition: transform .16s var(--ease), background .16s; white-space: nowrap; }
  #stop svg { width: 10px; height: 10px; color: #f0442f; }
  #stop:hover { background: #fff; transform: scale(1.03); }
  #stop:active { transform: scale(.96); }
  #stop kbd { font: 600 10px "Segoe UI", sans-serif; padding: 3px 7px; border-radius: 10px; background: rgba(26,21,19,.1); color: rgba(26,21,19,.66); }

  /* ---- AFH's cursor ------------------------------------------------------------------------------- */
  #trail, #cursor { position: fixed; left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity .35s; will-change: transform; pointer-events: none; }
  #trail { z-index: 28; } #cursor { z-index: 30; }
  #trail i { position: absolute; left: -62px; top: -62px; width: 124px; height: 124px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(var(--a), .6), rgba(var(--b), .32) 34%, rgba(var(--c), .13) 64%, transparent); transition: transform .35s var(--out); }
  #cursor.on, body.cursor #trail { opacity: 1; }
  #cursor.idle { opacity: .85; }
  body.cursor.idle #trail { opacity: .4; }
  #cursor .body { position: absolute; left: 0; top: 0; transform-origin: 3px 3px; transition: transform .16s var(--out); }
  #cursor.press .body { transform: scale(.8) rotate(-4deg); }
  body.press #trail i { transform: scale(.62); }
  #cursor svg { position: absolute; left: -5px; top: -4px; overflow: visible; filter: drop-shadow(0 1px 1.5px rgba(50,12,0,.6)) drop-shadow(0 4px 8px rgba(50,12,0,.28)) drop-shadow(0 0 9px rgba(var(--b), .6)); }
  #cursor .hold { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; border-radius: 50%; opacity: 0; transform: scale(.4);
    background: radial-gradient(closest-side, rgba(var(--hot), .6), rgba(var(--b), .4) 60%, transparent); transition: opacity .2s, transform .35s var(--spring); }
  #cursor.held .hold { opacity: 1; transform: none; }
  #tag, .chip { position: fixed; z-index: 31; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 14px; max-width: 360px;
    background: var(--glass); box-shadow: inset 0 0 0 1px var(--line), 0 8px 22px rgba(0,0,0,.36), 0 0 22px rgba(var(--b), .22); font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; pointer-events: none; }
  #tag { position: absolute; left: 24px; top: 22px; width: max-content; opacity: 0; transform: translate(-6px, -5px) scale(.88); transform-origin: 0 0; transition: opacity .25s, transform .4s var(--spring); }
  #tag.on { opacity: 1; transform: none; }
  #tag span { overflow: hidden; text-overflow: ellipsis; }
  .chip { animation: chip .4s var(--spring); transition: opacity .3s, transform .3s var(--ease); }
  .chip.out { opacity: 0; transform: translateY(-5px); }
  @keyframes chip { from { opacity: 0; transform: translateY(7px) scale(.88); } }
  .chip .cap { min-width: 0; height: 18px; padding: 0 6px; border-radius: 5px; font-size: 10.5px; box-shadow: none; background: rgba(255,255,255,.14); }

  /* clicks: a burst of light, and one thin ring leaving it */
  .burst, .ring { position: fixed; border-radius: 50%; pointer-events: none; z-index: 27; }
  .burst { width: 150px; height: 150px; margin: -75px; background: radial-gradient(closest-side, rgba(var(--hot), .95), rgba(var(--a), .6) 16%, rgba(var(--b), .3) 42%, rgba(var(--c), .1) 70%, transparent); animation: burst .62s var(--out) forwards; }
  .ring { width: 46px; height: 46px; margin: -23px; box-shadow: 0 0 0 1.5px rgba(var(--hot), .95), 0 0 14px rgba(var(--b), .85), inset 0 0 10px rgba(var(--b), .5); animation: ring .62s var(--out) forwards; }
  .alt { --a: 200, 170, 255; --b: 160, 110, 255; --c: 130, 90, 255; --hot: 236, 224, 255; }
  @keyframes burst { 0% { transform: scale(.12); opacity: 0; } 18% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
  @keyframes ring { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }

  /* typing and keys */
  .typing svg { width: 15px; height: 15px; flex: none; color: rgb(var(--a)); display: block; }
  .typing .txt { overflow: hidden; text-overflow: ellipsis; direction: ltr; font-family: "Cascadia Mono", Consolas, monospace; font-size: 11.5px; }
  .typing .caret { width: 2px; height: 14px; border-radius: 1px; background: rgb(var(--a)); box-shadow: 0 0 8px rgba(var(--a), .9); flex: none; animation: blink .9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #keys { position: fixed; left: 0; right: 0; bottom: 78px; display: flex; justify-content: center; z-index: 40; pointer-events: none; }
  .keyset { position: relative; display: flex; align-items: center; gap: 8px; padding: 11px 13px 13px; border-radius: 20px; background: var(--glass);
    box-shadow: inset 0 0 0 1px var(--line), 0 16px 40px rgba(0,0,0,.42), 0 0 60px rgba(var(--b), .28); animation: chip .45s var(--spring); transition: opacity .35s, transform .35s var(--ease); overflow: hidden; }
  .keyset.out { opacity: 0; transform: translateY(8px) scale(.97); }
  .keyset .plus, .chip .plus { color: var(--ink-3); font-weight: 600; }
  .cap { position: relative; min-width: 42px; height: 40px; padding: 0 12px; display: grid; place-items: center; border-radius: 11px; font-weight: 600; font-size: 13.5px;
    background: #35302d; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 3px 0 #171412; animation: cap .5s var(--ease) both; }
  .cap::after { content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0; animation: cap-light .7s var(--ease) both; animation-delay: inherit;
    box-shadow: inset 0 0 0 1.5px rgba(var(--hot), .9), inset 0 0 16px rgba(var(--b), .8), 0 0 18px rgba(var(--b), .8); }
  .cap.down, .cap.down::after { animation: none; }
  .cap.down { transform: translateY(2px); } .cap.down::after { opacity: 1; }
  @keyframes cap { 35% { transform: translateY(3px); } }
  @keyframes cap-light { 30% { opacity: 1; } }
  .keyset .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgb(var(--b)); transform-origin: 0 50%; }

  /* scrolling: a small track with a light sliding through it */
  .scroll { position: fixed; z-index: 21; width: 26px; height: 66px; margin: -33px 0 0 34px; border-radius: 13px; overflow: hidden; background: var(--glass); pointer-events: none;
    box-shadow: inset 0 0 0 1px var(--line), 0 6px 20px rgba(0,0,0,.34), 0 0 26px rgba(var(--b), .4); animation: chip .35s var(--spring); transition: opacity .3s; }
  .scroll.out { opacity: 0; }
  .scroll i { position: absolute; left: -4px; right: -4px; top: 0; height: 42px; background: radial-gradient(closest-side, rgba(var(--hot), 1), rgba(var(--a), .8) 30%, rgba(var(--b), .35) 62%, transparent); animation: slide .62s var(--ease) 2; opacity: 0; }
  @keyframes slide { 0% { transform: translateY(-36px); opacity: 0; } 30%, 75% { opacity: 1; } 100% { transform: translateY(62px); opacity: 0; } }

  /* looking closer, and a window coming forward */
  .zoombox, .winfocus { position: fixed; pointer-events: none; border-radius: 12px; }
  .zoombox { z-index: 16; box-shadow: 0 0 0 2px rgba(var(--hot), .95), 0 0 24px 2px rgba(var(--b), .85), inset 0 0 26px rgba(var(--b), .4), 0 0 0 9999px rgba(12,6,4,.24); animation: look 1.25s var(--ease) forwards; }
  .zoombox b { position: absolute; left: 50%; bottom: -17px; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line), 0 0 22px rgba(var(--b), .6); }
  .zoombox b svg { width: 17px; height: 17px; color: rgb(var(--a)); }
  @keyframes look { 0% { opacity: 0; transform: scale(1.07); } 22%, 78% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .winfocus { z-index: 13; box-shadow: 0 0 0 1.5px rgba(var(--hot), .9), 0 0 30px 3px rgba(var(--b), .75), 0 0 90px 8px rgba(var(--c), .4); animation: winfocus 1.15s var(--ease) forwards; }
  @keyframes winfocus { 0% { opacity: 0; transform: scale(1.025); } 28% { opacity: 1; transform: none; } 100% { opacity: 0; } }

  /* drags: a beam from where it was picked up */
  #drag { position: fixed; inset: 0; z-index: 18; pointer-events: none; overflow: visible; width: 100%; height: 100%; }
  #drag g { transition: opacity .5s; } #drag g.fade { opacity: 0; }
  #drag path { fill: none; stroke-linecap: round; }
  #drag .w { stroke: rgba(var(--b), .2); stroke-width: 16; } #drag .m { stroke: rgba(var(--b), .5); stroke-width: 7; } #drag .h { stroke: rgba(var(--hot), .98); stroke-width: 2; }

  /* ---- app approval cards ----------------------------------------------------------------------- */
  #asks { position: fixed; top: 84px; left: 50%; width: 440px; margin-left: -220px; display: flex; flex-direction: column; gap: 12px; z-index: 50; }
  .ask, .tip { background: rgba(22, 19, 18, .965); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 rgba(255,255,255,.06), 0 26px 64px rgba(0,0,0,.5), 0 0 90px rgba(var(--b), .26); transition: opacity .28s, transform .32s var(--ease); }
  .ask { padding: 18px; border-radius: 22px; animation: ask .6s var(--spring); }
  .ask.out, .tip.out { opacity: 0; transform: scale(.96); }
  @keyframes ask { from { opacity: 0; transform: translateY(-18px) scale(.93); } }
  .ask .head { display: flex; align-items: center; gap: 13px; }
  .ask .badge { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex: none; background: linear-gradient(140deg, rgb(var(--a)), rgb(var(--b)) 45%, rgb(var(--c))); box-shadow: 0 0 26px rgba(var(--b), .55); }
  .ask .badge svg { width: 21px; height: 21px; color: #fff; }
  .ask h2 { font-size: 15.5px; font-weight: 600; text-wrap: balance; }
  .ask .reason { margin-top: 3px; font-size: 12.5px; line-height: 1.4; color: var(--ink-2); }
  .ask .apps { margin: 15px 0 4px; display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow: auto; }
  .ask .app { display: flex; align-items: center; gap: 12px; padding: 9px 11px; border-radius: 13px; background: rgba(255,255,255,.05); animation: row .45s var(--out) both; }
  @keyframes row { from { opacity: 0; transform: translateY(6px); } }
  .ask .ico { width: 28px; height: 28px; border-radius: 8px; flex: none; display: grid; place-items: center; font-weight: 700; background: rgba(255,255,255,.1); overflow: hidden; }
  .ask .ico img { width: 28px; height: 28px; object-fit: contain; }
  .ask .nm { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ask .tier { font-size: 11px; padding: 3px 10px; border-radius: 10px; background: rgba(255,255,255,.07); color: var(--ink-2); white-space: nowrap; }
  .ask .tier.full { background: rgba(var(--b), .18); color: rgb(var(--a)); }
  .ask .note { font-size: 11.5px; line-height: 1.45; color: var(--ink-3); margin: 10px 2px 14px; }
  .btns { display: flex; gap: 8px; align-items: center; }
  .btns .sp { flex: 1; }
  .btn { height: 36px; padding: 0 16px; border-radius: 18px; font-weight: 600; font-size: 12.5px; background: rgba(255,255,255,.08); transition: transform .14s var(--ease), background .16s; }
  .btn:hover { background: rgba(255,255,255,.14); } .btn:active { transform: scale(.96); }
  .btn.primary { background: #f7f4f1; color: #1a1513; } .btn.primary:hover { background: #fff; }
  .btn.deny { color: #ffb0a3; background: none; padding: 0 8px; } .btn.deny:hover { background: rgba(255,110,90,.12); }

  /* ---- teach mode -------------------------------------------------------------------------------- */
  #shade { position: fixed; inset: 0; z-index: 8; pointer-events: none; opacity: 0; transition: opacity .5s var(--ease);
    background: radial-gradient(circle var(--r) at var(--sx, 50%) var(--sy, 50%), transparent 0 calc(var(--r) - 16px), rgba(6, 10, 18, .52) var(--r)); }
  body.lesson #shade { opacity: 1; }
  body.lesson.nopoint #shade { background: rgba(6, 10, 18, .3); }
  .beacon { position: fixed; z-index: 9; width: 0; height: 0; pointer-events: none; }
  .beacon i { position: absolute; left: -60px; top: -60px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(closest-side, transparent 52%, rgba(var(--b), .55) 78%, rgba(var(--hot), .9) 86%, rgba(var(--b), .4) 90%, transparent); opacity: 0; animation: beacon 2.2s var(--out) infinite; }
  .beacon i:nth-child(2) { animation-delay: 1.1s; }
  .beacon b { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--solid), 0 0 26px 6px rgba(var(--b), .8); }
  @keyframes beacon { 0% { transform: scale(.25); opacity: 0; } 20% { opacity: 1; } 100% { transform: scale(1.15); opacity: 0; } }
  .tip { position: fixed; z-index: 60; width: 344px; padding: 17px 18px 15px; border-radius: 20px; animation: tip .5s var(--spring); }
  @keyframes tip { from { opacity: 0; transform: translateY(10px) scale(.94); } }
  .tip .arrow { position: absolute; width: 14px; height: 14px; background: rgb(22, 19, 18); border-radius: 3px 0 0 0; transform: rotate(45deg); }
  .tip .top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .tip .stepn { font-size: 11.5px; font-weight: 600; color: rgb(var(--a)); }
  .tip .dots { display: flex; gap: 4px; margin-left: auto; }
  .tip .dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); }
  .tip .dots i.on { background: rgb(var(--b)); } .tip .dots i.now { width: 18px; box-shadow: 0 0 10px rgba(var(--b), .8); }
  .tip h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .tip p { font-size: 13px; line-height: 1.5; color: var(--ink-2); white-space: pre-wrap; }
  .tip .btns { margin-top: 15px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    body.on #glow .breath { animation: none; opacity: .5; } #glow .runs { display: none; }
  }
</style>
</head>
<body>
  <div id="glow"><div class="haze"></div><div class="breath"></div>
    <div class="runs"><i class="run t"></i><i class="run r"></i><i class="run u"></i><i class="run l"></i></div>
    <div class="rim"></div><div class="flare" id="flare"></div></div>
  <div id="shade"></div>
  <svg id="drag"></svg>

  <div id="pill" data-hit>
    <div class="mark"><svg viewBox="28 10 184 120" fill="none">
